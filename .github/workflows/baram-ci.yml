name: CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check Python code
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff==0.16.0"

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Check critical Python errors
        run: ruff check src --select F63,F7,F82 --output-format=github